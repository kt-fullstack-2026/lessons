<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Pretendard, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a8f45"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker></defs>
  <rect x="10" y="14" width="690" height="236" rx="14" fill="none" stroke="#9aa5b1" stroke-dasharray="8 6"/>
  <text x="30" y="42" font-size="16" font-weight="700" fill="#5b6b7b">내 PC (Git)</text>
  <g text-anchor="middle">
    <rect x="30" y="70" width="190" height="130" rx="12" fill="#ebf8f0" stroke="#1a8f45" stroke-width="2.5"/>
    <text x="125" y="104" font-size="18" font-weight="800" fill="#1c1c1e">작업 폴더</text>
    <text x="125" y="128" font-size="13.5" fill="#33475f">working tree</text>
    <text x="125" y="156" font-size="14" fill="#33475f">지금 고치는 파일</text>
    <text x="125" y="180" font-size="13" fill="#5b6b7b">방에 흩어진 물건</text>
    <rect x="265" y="70" width="190" height="130" rx="12" fill="#ebf8f0" stroke="#1a8f45" stroke-width="2.5"/>
    <text x="360" y="104" font-size="18" font-weight="800" fill="#1c1c1e">스테이징 영역</text>
    <text x="360" y="128" font-size="13.5" fill="#33475f">staging area (index)</text>
    <text x="360" y="156" font-size="14" fill="#33475f">다음 사진에 넣을 것</text>
    <text x="360" y="180" font-size="13" fill="#5b6b7b">상자에 담은 물건</text>
    <rect x="500" y="70" width="180" height="130" rx="12" fill="#1a8f45"/>
    <text x="590" y="104" font-size="18" font-weight="800" fill="#fff">로컬 저장소</text>
    <text x="590" y="128" font-size="13.5" fill="#e6f6ec">.git 폴더</text>
    <text x="590" y="156" font-size="14" fill="#fff">찍어 둔 사진(커밋)</text>
    <text x="590" y="180" font-size="13" fill="#d4f0de">테이프로 봉한 상자</text>
    <rect x="750" y="70" width="190" height="130" rx="12" fill="#eef4ff" stroke="#1f6feb" stroke-width="2.5"/>
    <text x="845" y="104" font-size="18" font-weight="800" fill="#1c1c1e">원격 저장소</text>
    <text x="845" y="128" font-size="13.5" fill="#33475f">GitHub (origin)</text>
    <text x="845" y="156" font-size="14" fill="#33475f">팀과 함께 보는 사진첩</text>
    <text x="845" y="180" font-size="13" fill="#5b6b7b">택배 보관소</text>
  </g>
  <line x1="220" y1="120" x2="263" y2="120" stroke="#1a8f45" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="242" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1a8f45">add</text>
  <line x1="455" y1="120" x2="498" y2="120" stroke="#1a8f45" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="477" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1a8f45">commit</text>
  <line x1="680" y1="110" x2="748" y2="110" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="714" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb">push</text>
  <line x1="748" y1="160" x2="682" y2="160" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="714" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb">pull</text>
  <text x="480" y="300" text-anchor="middle" font-size="14.5" fill="#5b6b7b">파일 수정 → add(고르기) → commit(사진 찍기) → push(올리기). 팀원의 사진은 pull로 받아 온다.</text>
</svg>
