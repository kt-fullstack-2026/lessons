<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Pretendard, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a8f45"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
  </defs>
  <text x="225" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#1a8f45">HTTP 요청 (브라우저 → 서버)</text>
  <text x="735" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6feb">HTTP 응답 (서버 → 브라우저)</text>
  <g font-size="14">
    <rect x="20" y="46" width="410" height="54" rx="8" fill="#ebf8f0" stroke="#1a8f45" stroke-width="2"/>
    <text x="34" y="68" font-weight="700" fill="#1a8f45">시작 줄</text>
    <text x="34" y="90" font-family="Consolas, monospace" fill="#1c1c1e">GET /products?page=2 HTTP/1.1</text>
    <rect x="20" y="108" width="410" height="96" rx="8" fill="#f3f4f6" stroke="#9aa5b1" stroke-width="2"/>
    <text x="34" y="130" font-weight="700" fill="#33475f">헤더 (부가 정보)</text>
    <text x="34" y="152" font-family="Consolas, monospace" fill="#1c1c1e">Host: shop.example.com</text>
    <text x="34" y="172" font-family="Consolas, monospace" fill="#1c1c1e">Accept: text/html</text>
    <text x="34" y="192" font-family="Consolas, monospace" fill="#1c1c1e">User-Agent: Chrome/…</text>
    <rect x="20" y="212" width="410" height="54" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="34" y="234" font-weight="700" fill="#33475f">본문 (보낼 데이터)</text>
    <text x="34" y="256" fill="#5b6b7b">GET은 보통 비어 있다. POST는 여기에 데이터를 싣는다</text>

    <rect x="530" y="46" width="410" height="54" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="544" y="68" font-weight="700" fill="#1f6feb">상태 줄</text>
    <text x="544" y="90" font-family="Consolas, monospace" fill="#1c1c1e">HTTP/1.1 200 OK</text>
    <rect x="530" y="108" width="410" height="96" rx="8" fill="#f3f4f6" stroke="#9aa5b1" stroke-width="2"/>
    <text x="544" y="130" font-weight="700" fill="#33475f">헤더 (부가 정보)</text>
    <text x="544" y="152" font-family="Consolas, monospace" fill="#1c1c1e">Content-Type: text/html; charset=utf-8</text>
    <text x="544" y="172" font-family="Consolas, monospace" fill="#1c1c1e">Content-Length: 1256</text>
    <text x="544" y="192" font-family="Consolas, monospace" fill="#1c1c1e">Date: …</text>
    <rect x="530" y="212" width="410" height="54" rx="8" fill="#fff" stroke="#1f6feb" stroke-width="2"/>
    <text x="544" y="234" font-weight="700" fill="#1f6feb">본문 (받은 내용)</text>
    <text x="544" y="256" font-family="Consolas, monospace" fill="#1c1c1e">&lt;!DOCTYPE html&gt;&lt;html&gt;…</text>
  </g>
  <line x1="436" y1="140" x2="524" y2="140" stroke="#1a8f45" stroke-width="3" marker-end="url(#g)"/>
  <line x1="524" y1="180" x2="436" y2="180" stroke="#1f6feb" stroke-width="3" marker-end="url(#b)"/>
  <text x="480" y="306" text-anchor="middle" font-size="14" fill="#5b6b7b">요청도 응답도 "시작 줄 + 헤더 + 빈 줄 + 본문" 모양이다.</text>
</svg>
