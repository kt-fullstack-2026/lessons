<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Pretendard, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a8f45"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <!-- 클라이언트 영역 -->
  <rect x="10" y="14" width="300" height="270" rx="14" fill="none" stroke="#9aa5b1" stroke-dasharray="8 6"/>
  <text x="30" y="42" font-size="16" font-weight="700" fill="#5b6b7b">내 PC (클라이언트)</text>
  <g text-anchor="middle">
    <rect x="40" y="64" width="240" height="120" rx="12" fill="#ebf8f0" stroke="#1a8f45" stroke-width="2.5"/>
    <text x="160" y="98" font-size="18" font-weight="800" fill="#1c1c1e">브라우저</text>
    <text x="160" y="122" font-size="13.5" fill="#33475f">Chrome · Edge · Whale</text>
    <text x="160" y="150" font-size="14" fill="#33475f">요청을 보내고, 받은 HTML을</text>
    <text x="160" y="170" font-size="14" fill="#33475f">화면으로 그린다</text>
    <rect x="40" y="206" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="160" y="231" font-size="15" font-weight="700" fill="#1c1c1e">VS Code</text>
    <text x="160" y="251" font-size="13" fill="#5b6b7b">HTML 파일을 만드는 에디터 · 05절</text>
  </g>
  <!-- DNS -->
  <g text-anchor="middle">
    <rect x="390" y="20" width="200" height="86" rx="12" fill="#f3f4f6" stroke="#5b6b7b" stroke-width="2"/>
    <text x="490" y="50" font-size="17" font-weight="800" fill="#1c1c1e">DNS</text>
    <text x="490" y="72" font-size="13.5" fill="#33475f">도메인 → IP 주소</text>
    <text x="490" y="92" font-size="13" fill="#5b6b7b">인터넷의 주소록</text>
  </g>
  <!-- 서버 -->
  <g text-anchor="middle">
    <rect x="680" y="64" width="260" height="198" rx="12" fill="#1f6feb"/>
    <text x="810" y="100" font-size="18" font-weight="800" fill="#fff">웹 서버</text>
    <text x="810" y="124" font-size="13.5" fill="#dbe7ff">예: www.example.com</text>
    <text x="810" y="160" font-size="14" fill="#fff">요청을 받아 처리하고</text>
    <text x="810" y="180" font-size="14" fill="#fff">HTML · CSS · JS · 데이터를</text>
    <text x="810" y="200" font-size="14" fill="#fff">응답으로 돌려준다</text>
    <text x="810" y="238" font-size="13" fill="#dbe7ff">나중에 Node.js · Spring으로 직접 만든다</text>
  </g>
  <!-- 화살표 -->
  <line x1="280" y1="76" x2="388" y2="56" stroke="#5b6b7b" stroke-width="2" marker-end="url(#o)"/>
  <text x="330" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6b7b">① 주소 묻기</text>
  <line x1="388" y1="90" x2="282" y2="104" stroke="#5b6b7b" stroke-width="2" marker-end="url(#o)"/>
  <text x="336" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6b7b">IP 알려 줌</text>
  <line x1="282" y1="140" x2="676" y2="140" stroke="#1a8f45" stroke-width="3" marker-end="url(#g)"/>
  <text x="480" y="132" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1a8f45">② HTTP 요청 (GET /index.html)</text>
  <line x1="676" y1="180" x2="284" y2="180" stroke="#1f6feb" stroke-width="3" marker-end="url(#b)"/>
  <text x="480" y="204" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f6feb">③ HTTP 응답 (200 OK + HTML)</text>
  <!-- 하단 설명 -->
  <g font-size="14" fill="#33475f">
    <text x="20" y="316">① URL을 입력하면 브라우저가 DNS에 서버의 IP 주소를 묻는다.        ② 그 주소로 HTTP 요청을 보낸다.</text>
    <text x="20" y="342">③ 서버가 HTTP 응답을 돌려준다.        ④ 브라우저가 받은 HTML·CSS·JS로 화면을 그린다.   (03·04절)</text>
  </g>
</svg>
