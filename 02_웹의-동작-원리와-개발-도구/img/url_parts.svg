<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" font-family="Pretendard, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Consolas, 'D2Coding', monospace" font-size="24" font-weight="700" text-anchor="middle">
    <rect x="20" y="40" width="110" height="50" rx="8" fill="#ebf8f0" stroke="#1a8f45" stroke-width="2"/><text x="75" y="74" fill="#1a8f45">https</text>
    <text x="150" y="74" fill="#5b6b7b">://</text>
    <rect x="175" y="40" width="250" height="50" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/><text x="300" y="74" fill="#1f6feb">shop.example.com</text>
    <rect x="435" y="40" width="80" height="50" rx="8" fill="#f3f4f6" stroke="#5b6b7b" stroke-width="2"/><text x="475" y="74" fill="#33475f">:443</text>
    <rect x="525" y="40" width="160" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="605" y="74" fill="#c2410c">/products</text>
    <rect x="695" y="40" width="160" height="50" rx="8" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/><text x="775" y="74" fill="#be185d">?page=2</text>
    <rect x="865" y="40" width="80" height="50" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><text x="905" y="74" fill="#6d28d9">#top</text>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="700">
    <text x="75" y="120" fill="#1a8f45">스킴(프로토콜)</text>
    <text x="300" y="120" fill="#1f6feb">도메인(호스트)</text>
    <text x="475" y="120" fill="#33475f">포트</text>
    <text x="605" y="120" fill="#c2410c">경로</text>
    <text x="775" y="120" fill="#be185d">쿼리 문자열</text>
    <text x="905" y="120" fill="#6d28d9">프래그먼트</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#5b6b7b">
    <text x="75" y="142">어떤 규칙으로</text>
    <text x="300" y="142">어느 서버에</text>
    <text x="475" y="142">서버의 어느 문</text>
    <text x="605" y="142">서버 안의 어떤 자원</text>
    <text x="775" y="142">추가 조건</text>
    <text x="905" y="142">페이지 안 위치</text>
  </g>
  <text x="480" y="186" text-anchor="middle" font-size="13.5" fill="#5b6b7b">https의 기본 포트 443, http의 기본 포트 80은 보통 생략한다. 프래그먼트는 서버로 보내지 않는다.</text>
</svg>
