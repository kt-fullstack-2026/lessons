<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Pretendard, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text x="20" y="34" font-size="18" font-weight="700" fill="#111827">Docker Desktop은 Windows 안에 작은 Linux를 두고, 그 위에서 컨테이너를 돌린다</text>

  <!-- hardware -->
  <rect x="40" y="462" width="880" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="480" y="484" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">내 컴퓨터 (CPU · 메모리 8GB 이상)</text>
  <text x="480" y="503" font-size="12" fill="#c2410c" text-anchor="middle">CPU의 "가상화" 기능이 켜져 있어야 한다 — 꺼져 있으면 BIOS(UEFI)에서 켠다</text>

  <!-- windows -->
  <rect x="40" y="60" width="880" height="394" rx="10" fill="#e8f0fe" stroke="#1f6feb"/>
  <text x="58" y="86" font-size="15" font-weight="700" fill="#1f6feb">Windows 11</text>

  <g font-size="12">
    <rect x="58" y="104" width="250" height="150" rx="8" fill="#ffffff" stroke="#1f6feb"/>
    <text x="72" y="128" font-size="13" font-weight="700" fill="#111827">내가 쓰는 프로그램</text>
    <text x="72" y="152" fill="#374151">Docker Desktop 창 (고래 아이콘)</text>
    <text x="72" y="174" fill="#374151">IntelliJ · VS Code의 Terminal</text>
    <text x="72" y="204" font-family="Consolas, monospace" fill="#111827">docker run hello-world</text>
    <text x="72" y="226" font-family="Consolas, monospace" fill="#111827">docker compose up -d</text>
    <text x="72" y="244" fill="#6b7280">명령은 Windows에서 친다</text>

    <line x1="308" y1="190" x2="400" y2="190" stroke="#5b6b7b" stroke-width="1.8" marker-end="url(#k)"/>
    <text x="354" y="180" text-anchor="middle" fill="#6b7280">명령 전달</text>

    <!-- wsl -->
    <rect x="402" y="104" width="500" height="250" rx="10" fill="#ecfdf3" stroke="#1a8f45"/>
    <text x="420" y="128" font-size="13" font-weight="700" fill="#1a8f45">WSL 2 — Windows 안의 작은 Linux (가상 머신)</text>
    <text x="420" y="148" fill="#374151">컨테이너는 Linux 기능으로 돈다. 그래서 Linux가 하나 필요하다</text>

    <rect x="420" y="164" width="464" height="172" rx="8" fill="#ffffff" stroke="#1a8f45"/>
    <text x="436" y="188" font-size="13" font-weight="700" fill="#111827">Docker 엔진 — "Engine running"이면 켜진 것</text>
    <rect x="436" y="204" width="132" height="118" rx="6" fill="#f0fdf4" stroke="#1a8f45"/>
    <text x="502" y="228" text-anchor="middle" font-weight="700" fill="#111827">컨테이너</text>
    <text x="502" y="248" text-anchor="middle" fill="#374151">hello-world</text>
    <text x="502" y="268" text-anchor="middle" fill="#6b7280">이 절에서</text>
    <rect x="584" y="204" width="132" height="118" rx="6" fill="#f0fdf4" stroke="#1a8f45"/>
    <text x="650" y="228" text-anchor="middle" font-weight="700" fill="#111827">컨테이너</text>
    <text x="650" y="248" text-anchor="middle" fill="#374151">postgres:17</text>
    <text x="650" y="268" text-anchor="middle" fill="#6b7280">14장</text>
    <rect x="732" y="204" width="136" height="118" rx="6" fill="#f0fdf4" stroke="#1a8f45"/>
    <text x="800" y="228" text-anchor="middle" font-weight="700" fill="#111827">컨테이너</text>
    <text x="800" y="248" text-anchor="middle" fill="#374151">redis · kafka …</text>
    <text x="800" y="268" text-anchor="middle" fill="#6b7280">21 · 22장</text>
  </g>

  <g font-size="12">
    <rect x="58" y="270" width="326" height="166" rx="8" fill="#fff4ec" stroke="#c2410c"/>
    <text x="72" y="294" font-size="13" font-weight="700" fill="#c2410c">설치할 때 고를 것 · 막히는 곳</text>
    <text x="72" y="318" fill="#374151">설치 화면: Use WSL 2 instead of Hyper-V</text>
    <text x="72" y="338" fill="#374151">WSL이 낡았으면 wsl --update (관리자)</text>
    <text x="72" y="358" fill="#374151">가상화가 꺼져 있으면 엔진이 안 켜진다</text>
    <text x="72" y="378" fill="#374151">처음 켤 때 약관(Accept)을 눌러야 돈다</text>
    <text x="72" y="398" fill="#374151">메모리를 많이 쓴다 → 안 쓸 때는 Quit</text>

    <rect x="402" y="364" width="500" height="76" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="418" y="388" font-size="13" font-weight="700" fill="#111827">9장 PostgreSQL(설치판)과는 따로다</text>
    <text x="418" y="408" fill="#374151">설치판은 Windows에서 5432번, 14장 컨테이너 DB는 5433번으로 연다.</text>
    <text x="418" y="426" fill="#374151">둘 다 켜져 있어도 번호가 달라 부딪치지 않는다</text>
  </g>
</svg>
