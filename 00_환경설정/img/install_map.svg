<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Pretendard, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <text x="20" y="34" font-size="18" font-weight="700" fill="#111827">과정 전체에서 쓰는 도구 — 언제 설치하고, 어디에 쓰나</text>

  <!-- timeline -->
  <line x1="40" y1="96" x2="920" y2="96" stroke="#5b6b7b" stroke-width="2" marker-end="url(#k)"/>

  <g font-size="13">
    <!-- step 1 -->
    <circle cx="90" cy="96" r="9" fill="#374151"/>
    <text x="90" y="72" text-anchor="middle" font-weight="700" fill="#374151">1장 사전학습</text>
    <rect x="30" y="118" width="120" height="96" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="90" y="142" text-anchor="middle" font-weight="700" fill="#111827">Git · Git Bash</text>
    <text x="90" y="162" text-anchor="middle" fill="#374151">GitHub 계정</text>
    <text x="90" y="198" text-anchor="middle" font-size="12" fill="#6b7280">1장 03절</text>

    <!-- step 2 -->
    <circle cx="260" cy="96" r="9" fill="#1f6feb"/>
    <text x="260" y="72" text-anchor="middle" font-weight="700" fill="#1f6feb">2장 첫 수업 전</text>
    <rect x="180" y="118" width="160" height="96" rx="8" fill="#e8f0fe" stroke="#1f6feb"/>
    <text x="260" y="142" text-anchor="middle" font-weight="700" fill="#111827">03 설치 전 확인</text>
    <text x="260" y="162" text-anchor="middle" font-weight="700" fill="#111827">04 VS Code + 확장</text>
    <text x="260" y="182" text-anchor="middle" font-weight="700" fill="#111827">05 Node.js 24</text>
    <text x="260" y="204" text-anchor="middle" font-size="12" fill="#6b7280">2~8장 화면 · 5장부터 npm</text>

    <!-- step 3 -->
    <circle cx="450" cy="96" r="9" fill="#7c3aed"/>
    <text x="450" y="72" text-anchor="middle" font-weight="700" fill="#7c3aed">9장 전</text>
    <rect x="370" y="118" width="160" height="96" rx="8" fill="#f3efff" stroke="#7c3aed"/>
    <text x="450" y="142" text-anchor="middle" font-weight="700" fill="#111827">08 PostgreSQL 17</text>
    <text x="450" y="162" text-anchor="middle" font-weight="700" fill="#111827">+ pgAdmin 4</text>
    <text x="450" y="204" text-anchor="middle" font-size="12" fill="#6b7280">9~13장 DB (설치판)</text>

    <!-- step 4 -->
    <circle cx="640" cy="96" r="9" fill="#c2410c"/>
    <text x="640" y="72" text-anchor="middle" font-weight="700" fill="#c2410c">10장 전</text>
    <rect x="560" y="118" width="160" height="96" rx="8" fill="#fff4ec" stroke="#c2410c"/>
    <text x="640" y="142" text-anchor="middle" font-weight="700" fill="#111827">06 JDK 21</text>
    <text x="640" y="162" text-anchor="middle" fill="#374151">(Eclipse Temurin)</text>
    <text x="640" y="182" text-anchor="middle" font-weight="700" fill="#111827">IntelliJ IDEA</text>
    <text x="640" y="204" text-anchor="middle" font-size="12" fill="#6b7280">10장부터 Spring</text>

    <!-- step 5 -->
    <circle cx="830" cy="96" r="9" fill="#1a8f45"/>
    <text x="830" y="72" text-anchor="middle" font-weight="700" fill="#1a8f45">14장 전</text>
    <rect x="750" y="118" width="170" height="96" rx="8" fill="#ecfdf3" stroke="#1a8f45"/>
    <text x="835" y="142" text-anchor="middle" font-weight="700" fill="#111827">07 Docker Desktop</text>
    <text x="835" y="162" text-anchor="middle" fill="#374151">(WSL 2)</text>
    <text x="835" y="204" text-anchor="middle" font-size="12" fill="#6b7280">14장부터 끝까지</text>
  </g>

  <!-- where tools sit -->
  <rect x="20" y="236" width="920" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="262" font-size="14" font-weight="700" fill="#111827">설치한 도구가 쓰이는 자리 — 2장의 "요청과 응답" 그림 위에</text>

  <g font-size="12">
    <rect x="40" y="280" width="190" height="140" rx="8" fill="#ffffff" stroke="#1f6feb"/>
    <text x="135" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb">화면 (브라우저)</text>
    <text x="54" y="326" fill="#111827">HTML · CSS · JS · React</text>
    <text x="54" y="348" fill="#374151">쓰는 곳: VS Code</text>
    <text x="54" y="370" fill="#374151">돌리는 곳: Chrome</text>
    <text x="54" y="392" fill="#374151">빌드 · 개발 서버: Node.js</text>

    <line x1="230" y1="350" x2="290" y2="350" stroke="#5b6b7b" stroke-width="1.6" marker-end="url(#k)"/>
    <text x="260" y="340" text-anchor="middle" fill="#6b7280">요청</text>

    <rect x="292" y="280" width="250" height="140" rx="8" fill="#ffffff" stroke="#c2410c"/>
    <text x="417" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">서버</text>
    <text x="306" y="326" fill="#111827">Node.js + Express (9 · 12장)</text>
    <text x="306" y="344" fill="#374151">→ VS Code에서 쓰고 Node.js로 돌린다</text>
    <text x="306" y="370" fill="#111827">Spring Boot (10장~)</text>
    <text x="306" y="388" fill="#374151">→ IntelliJ에서 쓰고 JDK 21로 돌린다</text>
    <text x="306" y="408" fill="#6b7280">Gradle · Spring은 따로 설치하지 않는다</text>

    <line x1="542" y1="350" x2="600" y2="350" stroke="#5b6b7b" stroke-width="1.6" marker-end="url(#k)"/>
    <text x="571" y="340" text-anchor="middle" fill="#6b7280">SQL</text>

    <rect x="602" y="280" width="150" height="140" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="677" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">DB</text>
    <text x="616" y="326" fill="#111827">PostgreSQL 17</text>
    <text x="616" y="344" fill="#374151">(설치판, 5432번)</text>
    <text x="616" y="370" fill="#111827">pgAdmin 4</text>
    <text x="616" y="388" fill="#374151">표를 눈으로 본다</text>

    <rect x="772" y="280" width="152" height="140" rx="8" fill="#ffffff" stroke="#1a8f45" stroke-dasharray="6 4"/>
    <text x="848" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#1a8f45">Docker (14장~)</text>
    <text x="786" y="326" fill="#374151">서버 · DB · Redis ·</text>
    <text x="786" y="344" fill="#374151">Kafka를 "설치하지 않고"</text>
    <text x="786" y="362" fill="#374151">컨테이너로 띄운다</text>
    <text x="786" y="388" fill="#6b7280">postgres:17 등</text>
    <text x="786" y="406" fill="#6b7280">이미지는 그 장에서</text>
  </g>

  <text x="20" y="466" font-size="14" font-weight="700" fill="#111827">작업 폴더는 하나: D:\workspace (한글 · 빈칸 없는 경로)</text>
  <text x="20" y="490" font-size="13" fill="#374151">모든 장의 프로젝트(web-basic, memo-api, board-api, board-client …)가 이 폴더 아래에 생긴다.</text>
  <text x="20" y="512" font-size="13" fill="#374151">09절 체크리스트의 버전 명령이 모두 답하면 준비 끝. 설치가 늦어도 그 장 전에만 끝내면 된다.</text>
</svg>
